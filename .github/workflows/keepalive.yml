# Free-tier Supabase pauses after 7 idle days; a daily anon query keeps it awake.
name: Supabase keepalive
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # The publishable key already ships in the app (Shared/Backend.swift).
      - run: >
          curl -fsS -o /dev/null
          'https://scgyssmzfurqjkgfomtq.supabase.co/rest/v1/profiles?select=id&limit=1'
          -H 'apikey: sb_publishable_ihHWwF0eSLK1SSkR85lS_A_25gle_43'
